plugins {
    alias(libs.plugins.androidApplication)
}

android {
    def releaseSigningPropertiesFile = rootProject.file("signing.properties")
    def releaseSigningProperties = new Properties()
    def releaseSigningValue = { key, defaultValue = "" ->
        def value = releaseSigningProperties.getProperty(key, defaultValue)
        if (value != null && value.length() >= 2 && ((value.startsWith("\"") && value.endsWith("\"")) || (value.startsWith("'") && value.endsWith("'")))) {
            return value.substring(1, value.length() - 1)
        }
        return value
    }
    if (releaseSigningPropertiesFile.exists()) {
        releaseSigningPropertiesFile.withInputStream { stream ->
            releaseSigningProperties.load(stream)
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    compileSdkVersion 37
    namespace 'com.apk.editor'

    defaultConfig {
        minSdkVersion 23
        targetSdk 37
        versionCode 34
        versionName "v0.34"
        vectorDrawables.useSupportLibrary = true
        testFunctionalTest = false
        testHandleProfiling = false

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (releaseSigningPropertiesFile.exists()) {
                storeFile rootProject.file(releaseSigningValue("storeFile", "app.key"))
                storePassword releaseSigningValue("storePassword")
                keyAlias releaseSigningValue("keyAlias")
                keyPassword releaseSigningValue("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }

        release {
            if (releaseSigningPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    flavorDimensions.add("release")
    productFlavors {
        play {
            applicationId "com.apk.explorer"
            dimension "release"
        }
        full {
            applicationId "com.apk.editor"
            dimension "release"
        }
    }
    lint {
        abortOnError false
    }

}

dependencies {
    implementation libs.apksig
    implementation libs.axml
    implementation libs.crashReporter

    implementation libs.apkutils
    implementation libs.adapters
    implementation libs.credits
    implementation libs.fileutils
    implementation libs.installerutils
    implementation libs.packageutils
    implementation libs.permissionutils
    implementation libs.themeutils
    implementation libs.translatorutils

    implementation libs.documentfile
    implementation libs.material
    implementation libs.zip4j
    implementation libs.baksmali
    implementation libs.smali
}